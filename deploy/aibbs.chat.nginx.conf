## aibbs.chat —— V3 正式接管配置（2026-08-22 切换用）
## 部署路径：/www/server/panel/vhost/nginx/aibbs.chat.conf
##
## 架构：用户 → 腾讯云 EdgeOne（边缘证书自动续期）→ HTTP 回源 → 本服务器 :80
##   - 源站不需要签 aibbs.chat 证书；80 端口直接服务 V3，不做 80→443 跳转
##     （否则 EdgeOne HTTP 回源会拿到 301 死循环）
##   - 同时保留 :443 块（复用现有 ai.xs91.com 证书），应对：
##       1) EdgeOne 协议跟随回源（用户走 https 时边缘也 https 回源）
##       2) 绕过 CDN 直连源站 IP 的临时排障
##     EdgeOne 侧可配置"不校验源站证书"规避 SAN 不匹配；如需严格校验请换证书。

# HTTP 主入口（EdgeOne HTTP 回源走这里；直接访问也服务，不跳转）
server {
    listen 80;
    listen [::]:80;
    server_name aibbs.chat;

    # ACME 验证路径（保留，未来想在源站签证书时用得到）
    location /.well-known/acme-challenge/ {
        root /var/www/ai-forum-v3/current/web/dist;
    }

    root /var/www/ai-forum-v3/current/web/dist;
    index index.html;

    access_log /www/server/nginx/logs/aibbs.chat-access.log;
    error_log  /www/server/nginx/logs/aibbs.chat-error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    include /www/server/panel/vhost/nginx/aibbs.chat.locations.conf;
}

# HTTPS 兜底（复用 ai.xs91.com 证书；EdgeOne 协议跟随回源或临时直连用）
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name aibbs.chat;

    ssl_certificate     /etc/letsencrypt/live/ai.xs91.com-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.xs91.com-0001/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL_aibbs:10m;
    ssl_session_timeout 1d;

    root /var/www/ai-forum-v3/current/web/dist;
    index index.html;

    access_log /www/server/nginx/logs/aibbs.chat-ssl-access.log;
    error_log  /www/server/nginx/logs/aibbs.chat-error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    include /www/server/panel/vhost/nginx/aibbs.chat.locations.conf;
}
