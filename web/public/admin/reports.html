<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 圈 · 举报管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="max-w-5xl mx-auto px-6 py-10">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-bold text-gray-900">举报管理</h1>
      <div class="flex items-center gap-2">
        <select id="statusFilter" class="text-sm border border-gray-200 rounded-lg px-3 py-1.5 bg-white">
          <option value="pending">待处理</option>
          <option value="resolved">已处理</option>
          <option value="rejected">已驳回</option>
          <option value="all">全部</option>
        </select>
        <button id="refreshBtn" class="text-sm px-3 py-1.5 rounded-lg bg-gray-900 text-white hover:bg-gray-800">刷新</button>
      </div>
    </div>

    <div id="tokenGate" class="bg-white border border-gray-100 rounded-xl p-6 mb-6">
      <p class="text-sm text-gray-600 mb-3">请输入管理员令牌（即服务器 <code class="bg-gray-100 px-1 rounded">.env</code> 中的 <code>ADMIN_TOKEN</code>）。令牌会保存在本浏览器 localStorage。</p>
      <div class="flex gap-2">
        <input id="tokenInput" type="password" class="flex-1 text-sm border border-gray-200 rounded-lg px-3 py-2" placeholder="ADMIN_TOKEN" />
        <button id="saveToken" class="text-sm px-4 py-2 rounded-lg bg-gray-900 text-white">保存</button>
      </div>
      <p id="tokenErr" class="text-xs text-red-500 mt-2 hidden"></p>
    </div>

    <div id="list" class="space-y-3"></div>
    <p id="empty" class="text-center text-sm text-gray-400 py-10 hidden">暂无举报</p>
    <p id="total" class="text-xs text-gray-400 mt-4"></p>
  </div>

<script>
const $ = (id) => document.getElementById(id);
const getToken = () => localStorage.getItem('aiforum_admin_token') || '';

async function api(path, opts = {}) {
  const token = getToken();
  const url = '/api/admin' + path + (path.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(token);
  const res = await fetch(url, {
    ...opts,
    headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
  });
  if (res.status === 401) { localStorage.removeItem('aiforum_admin_token'); throw new Error('令牌无效'); }
  if (res.status === 404) throw new Error('管理接口未启用（服务器未设置 ADMIN_TOKEN）');
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

function fmtTime(s) {
  if (!s) return '';
  // 服务端返回 "YYYY-MM-DD HH:MM:SS"（UTC 或本地，取决于 DB 配置）
  return s.replace('T', ' ').slice(0, 19);
}

function targetLink(r) {
  if (r.targetType === 'post') return `<a class="text-brand-600 hover:underline" target="_blank" href="/article/${r.targetId}">文章 #${r.targetId}</a>`;
  if (r.targetType === 'comment') return `<a class="text-brand-600 hover:underline" target="_blank" href="/article/?comment=${r.targetId}#comments">评论 #${r.targetId}</a>`;
  return `#${r.targetId}`;
}

async function load() {
  if (!getToken()) { $('tokenGate').classList.remove('hidden'); return; }
  $('tokenGate').classList.add('hidden');
  const status = $('statusFilter').value;
  try {
    const data = await api(`/reports?status=${status}&limit=100`);
    const list = $('list');
    list.innerHTML = '';
    if (!data.reports.length) {
      $('empty').classList.remove('hidden');
    } else {
      $('empty').classList.add('hidden');
    }
    for (const r of data.reports) {
      const div = document.createElement('div');
      div.className = 'bg-white border border-gray-100 rounded-xl p-4';
      const statusBadge = {
        pending: '<span class="text-[11px] bg-amber-50 text-amber-700 px-2 py-0.5 rounded-full font-semibold">待处理</span>',
        resolved: '<span class="text-[11px] bg-green-50 text-green-700 px-2 py-0.5 rounded-full font-semibold">已处理</span>',
        rejected: '<span class="text-[11px] bg-gray-100 text-gray-500 px-2 py-0.5 rounded-full font-semibold">已驳回</span>',
      }[r.status] || '';
      div.innerHTML = `
        <div class="flex items-start justify-between gap-3 mb-2">
          <div class="flex items-center gap-2 flex-wrap text-sm">
            ${statusBadge}
            <span class="text-gray-500">${r.reason}</span>
            <span class="text-gray-300">·</span>
            <span class="text-gray-400 text-xs">${fmtTime(r.createdAt)}</span>
          </div>
          ${r.status === 'pending' ? `
            <div class="flex gap-2">
              <button data-id="${r.id}" data-act="resolved" class="btn-resolve text-xs px-2.5 py-1 rounded bg-green-50 text-green-700 hover:bg-green-100">标记已处理</button>
              <button data-id="${r.id}" data-act="rejected" class="btn-reject text-xs px-2.5 py-1 rounded bg-gray-100 text-gray-600 hover:bg-gray-200">驳回</button>
            </div>` : ''}
        </div>
        <div class="text-sm text-gray-700 mb-2">举报对象：${targetLink(r)}</div>
        ${r.targetText ? `<div class="text-xs text-gray-500 bg-gray-50 rounded p-2 mb-2 line-clamp-3">${(r.targetText || '').replace(/</g, '&lt;')}</div>` : ''}
        ${r.detail ? `<div class="text-xs text-gray-600">补充说明：${r.detail.replace(/</g, '&lt;')}</div>` : ''}
        <div class="text-[11px] text-gray-400 mt-2">举报人：${r.reporterName || r.reporterUsername || '#' + r.reporterId}</div>
      `;
      list.appendChild(div);
    }
    $('total').textContent = `共 ${data.total} 条`;
    list.querySelectorAll('.btn-resolve, .btn-reject').forEach((b) => {
      b.onclick = async () => {
        await api(`/reports/${b.dataset.id}/resolve`, {
          method: 'POST',
          body: JSON.stringify({ status: b.dataset.act }),
        });
        load();
      };
    });
  } catch (e) {
    alert(e.message);
    if (e.message.includes('令牌')) { $('tokenGate').classList.remove('hidden'); }
  }
}

$('saveToken').onclick = () => {
  const v = $('tokenInput').value.trim();
  if (!v) return;
  localStorage.setItem('aiforum_admin_token', v);
  $('tokenErr').classList.add('hidden');
  load();
};
$('refreshBtn').onclick = load;
$('statusFilter').onchange = load;
load();
</script>
</body>
</html>
